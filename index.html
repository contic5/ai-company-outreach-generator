<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai-company-outreach-generator</title>
  </head>
  <body>
  <main>
  <h1>AI Company Outreach Generator</h1>
  <h2>Settings</h2>
  <span id="warning"></span>
  <form>
  <div class="container border secondary" id="form_container">
  <div class="row">
  <div class="col border"><label for="company">Company Name:</label></div>
  <div class="col border"><input id="company"></div>
  </div>

  <div class="row">
  <div class="col border"><label for="goal">Goal (Write as present tense verb):</label></div>
  <div class="col border"><textarea id="goal" rows="8"></textarea></div>
  </div>

  <div class="row">
  <div class="col border"><label for="sample_goals">Goal Suggestions</label></div>
  <div class="col border">

  <select id="sample_goal">
  <option value="hire a Spectrum Works graduate">hire a Spectrum Works graduate</option>
  <option value="form a work partnership">form a work partnership</option>
  <option value="arrange a meeting to learn work needs">arrange a meeting to learn work needs</option>
  <option value="">Custom</option>
  </select>
  </div>
  </div>

  <div class="row">
  <div class="col border"><label for="context">Context (Excessive context can lower accurac)</label></div>
  <div class="col border" id="knowledge_checkbox_div">
    INCLUDE CHECKBOX FOR EACH CONTEXT KEY
  </div>
  </div>
  </div>
  </form>


  <button id="submit_prompt_button">Submit</button>

  <h2>Query</h2>
  <div class="container" id="query"></div>

  <h2>Response</h2>
  <div class="container" id="response"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="/src/main.ts"></script>
  <script type="module">
  import {handle_submit,update_goal,load_checkboxes} from "/src/main.ts";

  let submit_prompt_button=document.getElementById("submit_prompt_button");
  submit_prompt_button.onclick=handle_submit;

  document.getElementById("sample_goal").onchange=update_goal;
  update_goal();
  load_checkboxes();
  </script>
  </body>
</html>
